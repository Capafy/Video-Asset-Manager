<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Asset Manager</title>
<style>
  :root{--bg:#14161a;--panel:#1e2229;--panel2:#242a33;--line:#2e3540;--ink:#e8ecf1;--muted:#8b96a5;
    --acc:#4f8cc9;--ok:#4fa87a;--warn:#d07a6a;--gen:#c9884f;--vio:#7b68ae;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  a{color:var(--acc);text-decoration:none}
  button,select,input[type=text]{background:#2a313c;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer}
  input[type=text]{cursor:text}
  button:hover{border-color:#4a5568}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  a.btn{display:inline-block;background:#2a313c;border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 12px;font-size:12px}
  .top{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 18px;
    background:rgba(20,22,26,.95);border-bottom:1px solid var(--line);z-index:20}
  .top b{font-size:15px}
  .top .sp{flex:1}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .muted{color:var(--muted)}
  .chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
  .chip.draft{color:var(--muted)} .chip.planning,.chip.confirmed{border-color:var(--acc);color:var(--acc)}
  .chip.generating{border-color:var(--gen);color:var(--gen)}
  .chip.delivered,.chip.done{border-color:var(--ok);color:var(--ok)}
  .chip.reviewing{border-color:var(--vio);color:var(--vio)}
  .chip.revision_requested{border-color:var(--warn);color:var(--warn)}
  .chip.running{border-color:var(--gen);color:var(--gen)}
  .chip.watching{border-color:var(--ok);color:var(--ok)}
  .chip.error{border-color:var(--warn);color:var(--warn)}
  .chip.starting{border-color:var(--muted);color:var(--muted)}
  .chip.archived,.chip.superseded{opacity:.55}
  /* list */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
  .card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;color:inherit;text-decoration:none}
  .card:hover{border-color:#4a5568}
  .card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .card .cov{height:130px;position:relative;background:#0d1014;display:flex;align-items:center;justify-content:center;color:#39424e;font-size:26px;overflow:hidden}
  .card .cov::before{content:"";position:absolute;inset:-12px;background-image:var(--cover);background-position:center;background-size:cover;filter:blur(14px);opacity:.28;transform:scale(1.08);pointer-events:none}
  .card .cov .cov-poster{position:relative;z-index:1;display:block;width:auto;max-width:100%;height:auto;max-height:100%;object-fit:contain}
  .card .bd{padding:10px 12px}
  .card .t{font-weight:600;font-size:13.5px;margin-bottom:4px}
  .card .m{font-size:11.5px;color:var(--muted)}
  /* detail */
  .phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .phead h1{font-size:19px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px;overflow-x:auto;scrollbar-width:thin}
  .tabs a{padding:7px 16px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs a.on{color:var(--ink);border-bottom-color:var(--acc)}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;min-width:0;overflow-x:auto}
  .sec h3{font-size:14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* assets */
  .agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
  .acard{display:block;width:100%;padding:0;text-align:left;font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;appearance:none}
  .acard:hover{border-color:#4a5568}
  .acard .th{height:100px;background:#0d1014 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#39424e;font-size:22px}
  .acard .nm{padding:6px 8px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acard .tg{padding:0 8px 6px;font-size:10.5px;color:var(--muted)}
  /* clips */
  .clip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;
    display:grid;grid-template-columns:170px 1fr;gap:14px}
  .clip .po{width:170px;height:96px;border:1px solid var(--line);padding:0;border-radius:6px;background:#0d1014 center/cover no-repeat;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#39424e;font:inherit;appearance:none}
  .clip .po:hover{border-color:#4a5568}
  .clip h4{font-size:13.5px;margin-bottom:4px}
  .clip .meta{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .clip-wait{font-size:11.5px;color:var(--muted);padding:5px 2px}
  video.player{width:100%;max-height:420px;background:#000;border-radius:8px;margin-top:8px}
  .pctrl{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  /* assemble */
  .seq{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
  .seqchip{display:flex;align-items:center;gap:6px;border:1px solid var(--ok);border-radius:8px;
    padding:6px 8px;background:var(--panel2);white-space:nowrap;font-size:12px}
  .seqchip .idx{font-weight:700;color:var(--ok)}
  .seqchip button{padding:1px 6px;font-size:11px}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:12px;margin-top:8px}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  /* timeline track */
  .trackwrap{position:relative;margin-top:12px;background:#10141a;border:1px solid var(--line);border-radius:8px;padding:10px 8px 8px;overflow-x:auto}
  .track{position:relative;display:flex;gap:4px;height:82px;min-width:max-content}
  .tseg{position:relative;border:1px solid var(--line);border-radius:6px;background:#0d1014 center/cover no-repeat;
    min-width:72px;cursor:pointer;overflow:hidden;flex-basis:0}
  .tseg:hover{border-color:var(--ok)}
  .tseg.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .tseg .tno{position:absolute;top:4px;left:6px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;font-size:11px}
  .tseg .tt{position:absolute;bottom:4px;left:6px;right:26px;font-size:10.5px;color:#fff;text-shadow:0 1px 3px #000;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tseg .td{position:absolute;top:4px;right:6px;font-size:10px;color:#d5dee8;text-shadow:0 1px 3px #000}
  .tseg .trm{position:absolute;bottom:3px;right:3px;opacity:0;transition:opacity .15s;padding:0 6px;font-size:11px}
  .tseg:hover .trm{opacity:1}
  .tseg.dragover{outline:2px dashed var(--acc);outline-offset:-2px}
  .playhead{position:absolute;top:2px;bottom:2px;width:2px;background:var(--warn);left:0;pointer-events:none;display:none;z-index:5}
  .playhead::before{content:"";position:absolute;top:-6px;left:-4px;border:5px solid transparent;border-top-color:var(--warn)}
  /* modal / overlay */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:90}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:820px;width:92vw;
    max-height:88vh;overflow:auto;padding:16px}
  .modal img{max-width:100%;max-height:52vh;display:block;margin:0 auto;border-radius:8px}
  .modal video{width:100%;max-height:52vh;background:#000;border-radius:8px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a313c;border:1px solid var(--line);
    padding:8px 18px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .25s;z-index:99;max-width:82vw}
  input[type=file]{display:none}
  .modal[aria-hidden="true"]{display:none}
  .modal[aria-hidden="false"]{display:flex}
  .modal.video-asset-overlay{padding:30px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
  .modal.video-asset-overlay .box{position:relative;width:min(940px,94vw);max-width:none;padding:0;border:0;background:transparent;border-radius:16px;max-height:calc(100dvh - 60px)}
  /* Close control: compact bordered icon, not a text link. */
  .video-asset-close{position:absolute;right:22px;top:18px;z-index:3;width:36px;height:36px;display:grid;place-items:center;font-size:22px;line-height:1;padding:0;border:1px solid #292c32;border-radius:9px;background:#111316;color:#c8cbd1}
  .video-asset-modal{width:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);border:1px solid #383b43;background:#121417;color:#f3f4f6;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border-radius:16px;overflow:hidden;box-shadow:0 40px 100px #000}
  .video-asset-modal .badge{align-self:flex-start;padding:5px 8px;border-radius:6px;background:rgba(96,125,255,.12);color:#96a8ff;font-size:11px;font-weight:700}
  .video-asset-modal .modal-media{min-height:480px;padding:20px;background:radial-gradient(circle at 64% 31%,#8f4a32,transparent 24%),linear-gradient(145deg,#2b2323,#121419);display:grid;place-items:center;position:relative}
  .video-asset-modal .modal-media video,.video-asset-modal .modal-media img,.video-asset-modal .modal-media audio{max-width:100%;max-height:440px;object-fit:contain;border-radius:8px;background:#000}
  .video-asset-modal .modal-media audio{width:100%}
  .video-asset-modal .modal-media .empty{border:0;background:transparent;max-width:85%;text-align:center;line-height:1.7;color:#8d929d}
  .video-asset-modal .modal-media .empty p{margin-top:8px;color:#f3f4f6}
  .video-asset-modal .modal-media .empty small{display:block;margin-top:5px;color:#707783}
  .video-asset-modal .modal-info{padding:26px;display:flex;flex-direction:column;min-width:0}
  .video-asset-modal .modal-info h2{font-size:20px;line-height:1.3;margin:14px 0 5px;overflow-wrap:anywhere}
  .video-asset-modal .modal-info .meta{color:#8d929d;font-size:12px}
  .video-asset-modal .info-line{padding:13px 0;border-bottom:1px solid #292c32;display:flex;justify-content:space-between;gap:16px;font-size:12px}
  .video-asset-modal .info-line span:first-child{color:#8d929d}.video-asset-modal .info-line span:last-child{text-align:right;color:#f3f4f6;overflow-wrap:anywhere}
  .video-asset-modal .modal-actions{margin-top:auto;display:grid;gap:8px;padding-top:22px}
  .video-asset-modal .modal-actions button,.video-asset-modal .modal-actions a{width:100%;text-align:center}
  .video-asset-modal .modal-actions button,.video-asset-modal .modal-actions a{padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.45;font-weight:600;box-shadow:none;white-space:normal}
  .video-asset-modal .modal-actions .secondary,.video-asset-modal .modal-actions .btn{color:#f3f4f6;background:#17191d;border:1px solid #343841}
    /* Drop feedback: a dashed cyan outline inset inside the lane plus a
     teal wash, so the whole target area reads as droppable. */
  .studio-track-lane.drop-target{outline:1px dashed #04bdca!important;outline-offset:-3px!important;background:#123239!important}
  .studio-track-lane.drop-target .studio-lane-hint{color:#7fd7e0}
  /* Clicking a library item only picks it (adding is a drag), so show that. */
  .studio-media.is-picked{outline:2px solid #ff7a1a;outline-offset:2px}
  .choice-list{display:grid;gap:8px;max-height:340px;overflow:auto}.choice-list button{text-align:left;overflow-wrap:anywhere}
  /* Dialogs carry their own panel: the legacy modal box stretched to
     820px with a blue-grey fill, which made them look long and off-colour. */
  #modal:has(.project-create-dialog) #modalbox{width:auto;max-width:min(460px,92vw);padding:0;background:transparent;border:0;box-shadow:none;overflow:visible}
  .project-create-dialog{width:min(460px,92vw);background:#15171b;border:1px solid #393c43;border-radius:16px;padding:26px;box-shadow:0 30px 90px #0008;max-height:90vh;overflow:auto}
  .project-create-dialog.choice-dialog{max-width:min(460px,92vw)}
  .project-create-dialog .choice-note{margin:0 0 16px;color:#a4acb8;font-size:13px;line-height:1.55}
  .project-create-dialog .choice-list button.secondary{min-height:44px;padding:10px 14px;background:#15181d;border:1px solid #292c32;border-radius:8px;color:#f3f4f6;font-size:13px;font-weight:500}
  .project-create-dialog .choice-list button.secondary:hover{background:#1c2128;border-color:#3a3f47}
  .project-create-dialog .choice-list p{margin:0}
  .video-project-form{display:grid;gap:16px}.video-project-form label{display:grid;gap:8px}.video-project-form input,.video-project-form select{width:100%;min-width:0}
  .video-asset-modal .modal-actions .primary{color:#fff;background:#ff7a1a;border-color:#ff7a1a}
  .primary .ui-icon,.primary svg{stroke:#fff!important}
  /* The project form is a compact dialog, not the legacy
     wide manager modal.  Keep it compact, dark, and orange-accented. */
  .modal.project-create-overlay{background:rgba(0,0,0,.72);backdrop-filter:blur(6px);padding:18px}
  .modal.project-create-overlay .box{width:min(460px,92vw);max-width:460px;padding:26px;background:#15171b;border:1px solid #393c43;border-radius:16px;box-shadow:0 30px 90px #0008}
  .project-create-dialog{color:#f3f4f6}
  .project-create-dialog h2{margin:0 0 20px;font-size:22px;line-height:1.2}
  .project-create-dialog label{display:grid;gap:8px;margin:16px 0;color:#f3f4f6;font-size:14px}
  .project-create-dialog input,.project-create-dialog select{width:100%;height:42px;background:#0d0f12;border:1px solid #343841;border-radius:8px;color:#f3f4f6;padding:0 11px;font:inherit}
  .project-create-dialog input::placeholder{color:#7e8793}
  .project-create-dialog input:focus,.project-create-dialog select:focus{outline:none;border-color:#ff7a1a}
  .project-create-dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
  .project-create-dialog footer button{min-height:42px;padding:0 16px;border-radius:9px}
  .project-create-dialog footer .secondary{background:#17191d;border:1px solid #292c32;color:#f3f4f6}
  .project-create-dialog footer .primary{background:#ff7a1a;border-color:#ff7a1a;color:#fff;font-weight:700}
  .project-create-dialog footer .primary:hover{background:#ff9b52}
  .project-create-dialog .project-create-existing{margin:0 0 4px;padding:0 0 16px;border-bottom:1px solid #21242a}
  .project-create-dialog .project-create-existing h3{margin:2px 0 10px;font-size:13px;font-weight:600;color:#a4acb8}
  .project-create-dialog .project-create-list{display:grid;gap:6px;max-height:176px;overflow:auto;padding-right:2px}
  .project-create-dialog .project-create-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:40px;padding:7px 11px;background:#15181d;border:1px solid #292c32;border-radius:8px;color:#f3f4f6;text-align:left;cursor:pointer}
  .project-create-dialog .project-create-item:hover{background:#1c2128;border-color:#3a3f47}
  .project-create-dialog .project-create-item strong{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .project-create-dialog .project-create-item small{color:#8d929d;font-size:11px;white-space:nowrap}
  .project-create-dialog .close-project-dialog{width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid #292c32;border-radius:9px;background:#111316;color:#c8cbd1;font-size:20px}
  body.studio-mode .studio-bin .workspace-transition-list{display:grid!important;gap:10px!important;padding:0!important;margin:12px 0 0!important}
  body.studio-mode .studio-bin .workspace-transition-list .transition-tile{display:grid!important;grid-template-columns:1fr auto!important;grid-template-rows:auto auto!important;min-height:0!important;padding:8px 8px 35px!important;border:1px solid #343a44!important;border-radius:8px!important;background:#1b1e24!important}
  body.studio-mode .studio-bin .workspace-transition-list .transition-demo{grid-column:1 / -1!important;grid-row:1!important;height:64px!important;margin:0 0 9px!important;border-radius:5px!important}
  body.studio-mode .studio-bin .workspace-transition-list .transition-tile>span:not(.transition-demo){grid-column:1!important;grid-row:2!important;align-self:start!important;font-size:10px!important;color:#cdd3dd!important;line-height:1.35!important}
  body.studio-mode .studio-bin .workspace-transition-list .transition-tile .asset-add{grid-column:2!important;grid-row:2!important;right:5px!important;bottom:4px!important;width:22px!important;height:22px!important;min-height:22px!important;border:1px solid #536071!important;border-radius:5px!important;background:#303740!important;color:#f1f4f8!important;font-size:14px!important}
  body.studio-mode .studio-bin .workspace-transition-list .transition-tile .asset-add:hover,body.studio-mode .studio-bin .workspace-transition-list .transition-tile .asset-add:focus-visible{background:#0b7781!important;border-color:#0b7781!important;color:#fff!important}
  @media(max-width:900px){.modal.video-asset-overlay{padding:48px 12px 12px}.modal.video-asset-overlay .box{max-height:calc(100dvh - 60px)}.video-asset-modal{grid-template-columns:1fr}.video-asset-modal .modal-media{min-height:220px}.video-asset-modal .modal-media video{max-height:34dvh}.video-asset-modal .modal-info{padding:22px}}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .script-list,.final-list{display:grid;gap:10px;margin-top:10px}
  .script-card,.final-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
  .script-card h4,.final-card h4{font-size:13px;margin-bottom:4px}
  .script-card p,.final-card p{font-size:11.5px;color:var(--muted);margin:3px 0}
  .script-card .actions,.final-card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .empty{padding:12px;color:var(--muted)}
  .empty-state{grid-column:1/-1;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:24px 18px;margin-top:16px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px;color:var(--muted)}
  .empty-state .mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:18px;color:var(--acc);margin-bottom:3px}
  .empty-state strong{font-size:13px;color:var(--ink);font-weight:600}
  .empty-state p{max-width:520px;font-size:12px;line-height:1.65}
  /* One loading animation for the whole app: it is in the first HTML bytes, so it
     covers the shell download and the first data fetch, and it is dropped the
     moment a real view renders. */
  #bootLoading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:var(--bg);color:var(--ink)}
  #bootLoading strong{font-size:14px;font-weight:600}
  #bootLoading p{max-width:520px;margin:0;font-size:12px;line-height:1.65;color:var(--muted)}
  #bootLoading code{font-size:11.5px;color:var(--acc)}
  .loading-spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(132,154,181,.22);border-top-color:var(--acc);animation:vam-spin .8s linear infinite}
  @keyframes vam-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.loading-spinner{animation:none}}
  .sync-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
  .sync-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
  .sync-badge.running{border-color:var(--gen);color:var(--gen)}
  .sync-badge.watching{border-color:var(--ok);color:var(--ok)}
  .sync-badge.error{border-color:var(--warn);color:var(--warn)}
  .receive-panel{background:linear-gradient(135deg,rgba(79,140,201,.12),rgba(79,168,122,.08));
    border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:14px 0 16px}
  @supports (color: color-mix(in srgb, red 50%, white)){
    .receive-panel{border-color:color-mix(in srgb,var(--acc) 38%,var(--line))}
  }
  .receive-panel.waiting{background:linear-gradient(135deg,rgba(201,136,79,.13),rgba(79,140,201,.08));
    border-color:color-mix(in srgb,var(--gen) 45%,var(--line))}
  .receive-panel h3{font-size:14px;margin-bottom:4px}
  .receive-panel p{color:var(--muted);font-size:12px;margin:2px 0}
  .receive-panel .receive-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}

  /* Studio shell: a calm, media-first surface that keeps dense controls
     legible without turning the manager into a generic dashboard. */
  :root{
    --bg:#0c1015;--panel:#151b23;--panel2:#1d2631;--line:#2b3745;
    --ink:#f2f5f8;--muted:#91a0b2;--acc:#78a9ff;--ok:#5bd3a4;
    --warn:#f0a56b;--gen:#f0bd76;--vio:#b09cff;
  }
  body{
    background:
      radial-gradient(900px 480px at 8% -8%,rgba(70,111,180,.16),transparent 62%),
      radial-gradient(760px 420px at 92% 0%,rgba(74,148,123,.08),transparent 64%),
      var(--bg);
    color:var(--ink);letter-spacing:.005em;
  }
  .top{
    min-height:62px;padding:12px 24px;background:rgba(12,16,21,.78);
    border-bottom:1px solid rgba(132,154,181,.18);backdrop-filter:blur(18px);
  }
  .top b a{display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em}
  .top b a:first-letter{font-size:18px}
  .top #crumb{font-size:12px}
  .wrap{max-width:1320px;padding:28px 24px 64px}
  h1,h2,h3,h4{letter-spacing:-.012em}
  h1{font-weight:720}
  button,select,input[type=text],a.btn{
    min-height:34px;border-radius:9px;padding:7px 13px;
    background:rgba(35,45,58,.86);border-color:rgba(132,154,181,.2);
    transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease;
  }
  button:hover,a.btn:hover{background:#2a384a;border-color:rgba(120,169,255,.55);transform:translateY(-1px)}
  button:active,a.btn:active{transform:translateY(0)}
  /* Disabled actions are unavailable, not busy.  A wait cursor here made
     Delete/Undo/Redo look like they were still processing on hover. */
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  button.primary{background:linear-gradient(135deg,#6e9ff3,#6e8fe4);border-color:#7caaff;color:#fff;box-shadow:0 7px 18px rgba(73,113,192,.2)}
  button.primary:hover{background:linear-gradient(135deg,#81afff,#7c9af2);border-color:#a5c4ff}
  a.btn{line-height:18px}
  .top button{min-height:32px;padding:6px 12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:20px}
  .card{border-radius:14px;background:linear-gradient(160deg,rgba(24,32,42,.98),rgba(17,23,31,.98));border-color:rgba(132,154,181,.18);box-shadow:0 14px 30px rgba(0,0,0,.14);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  .card:hover{border-color:rgba(120,169,255,.65);transform:translateY(-3px);box-shadow:0 18px 34px rgba(0,0,0,.24)}
  /* Project-list covers stay compact and consistent even on narrow windows.
     The media preview/detail views keep their own aspect-ratio rules below. */
  .card .cov{height:130px;aspect-ratio:auto;background-color:#0b1016;color:#6b7b8e;font-size:30px;position:relative}
  .card .cov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(4,7,11,.58));pointer-events:none}
  .card .bd{padding:14px 15px 15px}
  .card .t{font-size:14px;margin-bottom:6px}
  .card .m{font-size:11.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .chip{padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.02)}
  .phead{gap:14px;margin-bottom:14px}
  .phead h1{font-size:22px}
  .phead>.muted{font-size:12px}
  .bar{height:7px;min-width:170px;background:#25303d;border-radius:99px}

  .tabs{gap:3px;padding:4px;margin:8px 0 20px;border:1px solid rgba(132,154,181,.16);border-radius:12px;background:rgba(18,25,33,.7);overflow-x:auto}

  .sec{padding:18px 19px;margin-bottom:16px;border-radius:14px;background:linear-gradient(160deg,rgba(24,31,41,.94),rgba(18,24,32,.94));border-color:rgba(132,154,181,.16);box-shadow:0 10px 24px rgba(0,0,0,.1)}
  .sec h3{font-size:15px;margin-bottom:12px}
  .receive-panel{padding:16px 18px;margin:0 0 18px;border-radius:14px;background:linear-gradient(125deg,rgba(72,116,189,.16),rgba(64,137,112,.09));border-color:rgba(120,169,255,.28);box-shadow:0 12px 25px rgba(0,0,0,.1)}
  .receive-panel.waiting{background:linear-gradient(125deg,rgba(192,129,72,.14),rgba(72,116,189,.1));border-color:rgba(240,165,107,.32)}
  .receive-panel h3{font-size:14px}
  .receive-panel .receive-actions{margin-top:12px}
  .empty-state{min-height:210px;margin-top:20px;border-radius:14px;background:rgba(20,27,36,.72);border-color:rgba(132,154,181,.25)}
  .empty-state .mark{width:42px;height:42px;border-radius:12px;background:rgba(120,169,255,.1);border-color:rgba(120,169,255,.26)}
  .overview-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:16px;align-items:start}
  .hero-card{padding:18px;border:1px solid rgba(132,154,181,.18);border-radius:16px;background:linear-gradient(145deg,rgba(24,33,44,.98),rgba(16,22,30,.98));box-shadow:0 16px 32px rgba(0,0,0,.16);min-width:0}

  .hero-player-wrap{position:relative;overflow:hidden;border-radius:12px;background:#05080c;border:1px solid rgba(132,154,181,.2)}
  .hero-video{display:block;width:100%;max-height:520px;aspect-ratio:16/9;object-fit:contain;background:#05080c}
  .hero-video.portrait{aspect-ratio:9/16;max-height:560px}
  .video-badge{position:absolute;left:11px;bottom:10px;padding:4px 8px;border-radius:7px;background:rgba(4,8,12,.72);font-size:11px;color:#dce8f6;backdrop-filter:blur(8px)}
  .hero-empty{min-height:260px;display:grid;place-items:center;text-align:center;padding:32px;color:var(--muted);background:radial-gradient(circle at 50% 20%,rgba(120,169,255,.09),transparent 55%),#080d13}

  .hero-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11.5px}

  .metric-stack{display:grid;gap:12px;min-width:0}
  .metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

  .metric .label{color:var(--muted);font-size:11px}
  .metric .value{display:block;margin-top:4px;font-size:23px;line-height:1.1;font-weight:720;letter-spacing:-.04em}

  .progress-list{display:grid;gap:9px}

  .progress-track{height:6px;border-radius:99px;background:#26313d;overflow:hidden}

  .clip{padding:14px;border-radius:13px;background:rgba(29,38,49,.78);border-color:rgba(132,154,181,.16);box-shadow:0 8px 18px rgba(0,0,0,.08)}

  .clip h4{font-size:14px}
  .acard,.script-card,.final-card{border-radius:11px;border-color:rgba(132,154,181,.16);background:rgba(29,38,49,.76)}

  /* Workspace shell ----------------------------------------------------
     A quiet black-neutral surface with one warm orange action color.  These
     classes are intentionally presentation-only: workspace.js supplies the
     existing project/library data and event handlers. */
  :root{
    --wx-bg:#0b0b0c;--wx-surface:#131314;--wx-surface-2:#1a1a1c;
    --wx-line:#2b2b2e;--wx-line-soft:#222225;--wx-text:#f4f1ec;
    --wx-muted:#98938c;--wx-accent:#f97316;--wx-accent-hi:#fb923c;
    --wx-accent-soft:rgba(249,115,22,.13);--wx-shadow:0 18px 48px rgba(0,0,0,.28);
  }
  body{background:radial-gradient(900px 520px at 15% -16%,rgba(249,115,22,.08),transparent 62%),var(--wx-bg)}
  .top{min-height:64px;padding:11px 24px;background:rgba(11,11,12,.9);border-bottom:1px solid var(--wx-line-soft);backdrop-filter:blur(18px)}
  .top b a{gap:9px;color:var(--wx-text)!important;font-size:15px}

  .top-nav a:hover,.top-nav a:focus-visible{color:var(--wx-text);background:var(--wx-accent-soft);border-color:rgba(249,115,22,.28);outline:none}
  .top-nav a[aria-current="page"]{color:var(--wx-accent-hi);background:var(--wx-accent-soft);border-color:rgba(249,115,22,.3)}
  .top #crumb{color:var(--wx-muted)}
  .top button,.top a.btn{background:#18181a;border-color:var(--wx-line);color:var(--wx-text)}
  .top button:hover,.top a.btn:hover{background:#222225;border-color:rgba(249,115,22,.45)}
  .wx-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:10px 0 20px}
  .wx-page-head h1{font-size:26px;line-height:1.15;letter-spacing:-.035em;color:var(--wx-text)}

   which keeps the page from flashing unstyled content. */
(function(){
  const box=document.getElementById("bootLoading");
  const host=document.getElementById("app");
  if(!box||!host)return;
  const skin=document.getElementById("skinCss");
  /* The skin counts as in only once it actually applies: a loaded sheet still on
     media="print" would leave the page unstyled.  If the onload swap was missed
     (some proxies), this performs it. */
  const applySkin=()=>{
    if(!skin)return true;
    if(skin.media==="all")return true;
    if(skin.sheet){skin.media="all";return true;}
    return false;
  };
  let viewReady=false;
  let skinReady=applySkin();
  let done=false;
  const settle=()=>{
    if(done||!viewReady||!skinReady)return;
    done=true;
    box.remove();
    observer.disconnect();
    if(poll)poll=null;
  };
  let poll=null;
  const observer=new MutationObserver(()=>{viewReady=true;settle();});
  observer.observe(host,{childList:true});
  if(skin&&!skinReady){
    skin.addEventListener("load",()=>{skinReady=applySkin();settle();});
    /* A stylesheet that never arrives must not hold the page hostage. */
    skin.addEventListener("error",()=>{skinReady=true;settle();});
    poll=setInterval(()=>{if(!skinReady){skinReady=applySkin();settle();}},250);
  }
  setTimeout(()=>{viewReady=true;skinReady=true;settle();},30000);
})();

    image: { max:  20 * 1024 * 1024, ext: ["jpg","jpeg","png","webp","gif","bmp"] },

    /* studio-mode stays until the destination surface has rendered: dropping it
       here exposed the project page underneath for a frame (the Back flash). */
    perfSpan.cached=libraryHasPayload()?1:0;
    if(typeof workspaceRenderLibrary==="function")return timed("main",()=>workspaceRenderLibrary());
    return timed("main",()=>renderList());
  }
  const m=h.match(/^#\/p\/([^/]+)(?:\/(\w+))?/);
  if(!m){cur.slug=null;cur.doc=null;cur.state=null;cur.changeToken=null;listChangeToken=null;$("#crumb").textContent="";perfSpan.cached=libraryHasPayload()?1:0;return timed("main",()=>renderList());}
  const slug=decodeURIComponent(m[1]),requested=m[2]||"overview";
  document.body.classList.remove("reference-home-mode");
  document.querySelector("body > .top")?.style.removeProperty("display");
  const previousSlug=cur.slug;
  cur.slug=slug;
  /* ``assemble`` is the legacy deep-link.  It intentionally resolves to the
     same Studio surface so old bookmarks keep working without maintaining a
     second editor implementation. */
  cur.tab=requested==="assemble"?"studio":["overview","scripts","assets","clips","finals","studio","logs"].includes(requested)?requested:"overview";
  document.body.classList.toggle("studio-mode",cur.tab==="studio");
  /* Tab switching within the SAME project must be instant: the manifest is
     already in memory and the 3s poll keeps it fresh, so do not re-fetch the
     full project document on every tab click (rapid clicks made each click
     wait on a full JSON round-trip + rebuild). */
  if(previousSlug===slug&&cur.doc&&cur.state&&!cur.dirty){
    try{
      $("#crumb").textContent="/ "+(cur.doc.title||slug);
      renderProjectTabs();
      if(cur.tab==="studio"){
        if(studio.slug===slug&&studio.timeline&&Number(studio.rev||0)===Number(cur.doc.rev||0)){
          timed("main",()=>{renderStudio();studioHydrateMediaPoolDurations();});
        }else{
          await tStudio();
        }
      }else{
        timed("main",()=>renderProject());
      }
      schedulePoll(0);
      return;
    }catch(_){/* fall through to a full reload on unexpected failures */}
  }
  /* Stale-while-revalidate: paint the manifest we already hold, then refresh in
     the background, so switching pages never waits on the network. */
  const cached=PROJECT_CACHE.get(slug);
  if(cached&&cached.doc){
    cur.doc=cached.doc;cur.state=cached.state;cur.changeToken=cached.token;
    cur.pendingOps=[];cur.dirty=false;
    $("#crumb").textContent="/ "+(cached.doc.title||slug);
    perfSpan.cached=1;
    timed("main",()=>renderProject());
    schedulePoll(0);
    refreshProject(slug,routeId,h);
    return;
  }
  try{
    const d=await timedFetch("project",jget(`./api/project/${encodeURIComponent(slug)}`));
    if(routeId!==routeSeq||location.hash!==h)return;
    applySyncState(d.sync);
    cur.doc=normalizeClientProject(d.project);cur.state=d.state;cur.changeToken=d.changes?.token||null;cur.pendingOps=[];cur.dirty=false;
    rememberProject(slug,d);
    $("#crumb").textContent="/ "+(cur.doc.title||slug);
    perfSpan.cached=0;
    timed("main",()=>renderProject());
  }catch(error){
    if(routeId!==routeSeq||location.hash!==h)return;
    applySyncState(error?.data?.sync);
    cur.doc=null;cur.state=null;cur.changeToken=null;cur.pendingOps=[];cur.dirty=false;
    if(Number(error?.status||error?.message)===404){
      renderWaitingProject();
    }else{
      renderWaitingProject("Unable to load projects. The manager will keep retrying the connection.");
    }
  }
}

async function renderList(existingPayload=null){

  const unmatchedCount=Math.min(pendingCount,syncNumber(payload.unmatched_count??payload.sync?.unmatched_count??payload.sync?.unmatched));
  const deliveryFailedCount=Math.min(Math.max(0,pendingCount-unmatchedCount),syncNumber(payload.delivery_failed_count??payload.sync?.delivery_failed_count??payload.sync?.delivery_failed));
  const scanFailedCount=syncNumber(payload.sync?.scan_failed??payload.sync?.failed);

        <div class="cov" style="${cover?`--cover:url('${cover}')`:""}">${cover?`<img class="cov-poster" src="${esc(cover)}" alt="" loading="lazy" decoding="async">`:"🎬"}</div>

    </div>${rows.length?"":connectionState}`;
  bindSyncButtons();

/* ----- finished outputs ----- */
function finalLabel(kind){return ({official:"Official final",preview:"Assembly preview",export:"Local export"}[String(kind||"").toLowerCase()]||"Finals");}
const VIDEO_FILE_EXTENSIONS=new Set(["mp4","mov","webm","m4v","mkv","avi","mpeg","mpg","ts","ogv","3gp","flv"]);
function fileExtension(file){return String(file||"").split("?")[0].split("#")[0].split(".").pop().toLowerCase();}
function isVideoFile(file){return VIDEO_FILE_EXTENSIONS.has(fileExtension(file));}
function finalKind(file){const ext=fileExtension(file);return VIDEO_FILE_EXTENSIONS.has(ext)?"video":["mp3","wav","m4a","aac","ogg"].includes(ext)?"audio":["jpg","jpeg","png","webp","gif","bmp","svg"].includes(ext)?"image":"file";}
function videoFallbackForFinal(item,doc=cur.doc){
  if(item&&isVideoFile(item.file))return item.file;

  const candidates=finalsOf(doc).filter(x=>x&&x.status!=="superseded"&&isVideoFile(x.file));
  candidates.sort((a,b)=>String(b.created||"").localeCompare(String(a.created||"")));
  return candidates[0]?.file||null;
}

/* A stale tab can retain an old render record after a project has been

function studioApplyReferenceField(field,value,checked){
  const picked=studioSelected();
  if(!picked)return;
  if(field==='volume'){
    const pct=Math.max(0,Math.min(100,Number(value)));
    studioApplyField('audio:gain',pct<=0?-60:20*Math.log10(pct/100));
    return;
  }
  if(field==='audio:detach'){
    studioApplyField(field,Boolean(checked));
    return;
  }
  if(field==='duration'){
    const num=Number(value),item=picked.item;
    if(!Number.isFinite(num)||num<.1)return toast('Enter a valid duration');
    const speed=Math.max(.25,Number(item.speed)||1),sourceDuration=studioItemSourceDuration(item);

    const before=studioCopy(studio.timeline);
    item.duration=num;item.out=nextOut;
    const op={op:'trim',item_id:item.id,in:Number(item.in||0),out:item.out};
    studio.history.push({before,after:studioCopy(studio.timeline),op});studio.future=[];
    studioInvalidatePreview();studioPersist(op);studioRefreshAfterField(picked,field);studioHydrateRenderWhenIdle();studioQueueDraw();
    return;
  }
  studioApplyField(field,value);
}

    if(!mod&&!e.altKey&&(e.key==="t"||e.key==="T")){e.preventDefault();const textTab=document.querySelector('[data-workspace-mode="text"]');if(textTab)textTab.click();if(typeof workspaceStudioAddText==="function")workspaceStudioAddText("subtitle");return;}
    if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?studioRedo():studioUndo();return;}
    if(mod&&e.key.toLowerCase()==="y"){e.preventDefault();studioRedo();return;}
    if(mod&&e.key.toLowerCase()==="c"){e.preventDefault();studioCopySelection();return;}
    if(mod&&e.key.toLowerCase()==="v"){e.preventDefault();studioPasteSelection();return;}
    if(e.shiftKey&&(e.key==="Delete"||e.key==="Backspace")){e.preventDefault();studioRippleDelete();return;}
    /* A track op button that kept focus turned Delete into another activation of
         that button; ignore edit keys while one of them holds focus. */
      if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".studio-track-op"))return;
      if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();studioRemove();return;}
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      /* Frame stepping: project FPS granularity, Shift = 10 frames. */
      e.preventDefault();
      studioStepFrame((e.key==="ArrowRight"?1:-1)*(e.shiftKey?10:1));
      return;
    }
    if(e.key==="Home"||e.key==="End"){
      /* Jump to the loop range start / end when looping, else timeline ends. */
      e.preventDefault();
      const range=studio.loop?studioLoopRange():null;
      if(e.key==="Home")studioSetPlayhead(range?range.start:0,studioTotal());
      else studioSetPlayhead(range?range.end:studioPlaybackDuration(),studioTotal());
      return;
    }
    if(e.key===" "){e.preventDefault();if(cur.tab==="studio")studioTogglePlayback();}
   });
}

/* ----- assemble / export (legacy implementation retained) ----- */
let seqPlayer={idx:-1,durs:{}};
function tAssemble(){
  const d=normalizeClientProject(cur.doc),clips=clipsOf(d),a=d.assembly=d.assembly||{order:[],exports:[]};
  const byId=Object.fromEntries(clips.map(c=>[c.id,c]));
  const addable=clips.filter(c=>c.status==="delivered"&&!a.order.includes(c.id));
  const dur=id=>seqPlayer.durs[id]||byId[id]?.duration||5;
  const total=a.order.reduce((s,id)=>s+dur(id),0);
  $("#tabbody").innerHTML=`
    <div class="sec"><h3>Assembly preview</h3>
      <video id="seqvideo" class="player" controls playsinline></video>
      <div class="row" style="margin-top:8px">
        <button type="button" id="playall" class="primary" aria-label="Preview assembly from start">▶ Preview assembly</button>
        <span class="muted">${a.order.length} clips · about ${Math.round(total)}s · Select any timeline position to play from there</span>
        <span class="sp" style="flex:1"></span>
        <button type="button" id="mkpreview">Generate assembly preview</button>
        ${videoFallbackForFinal({file:a.preview},cur.doc)&&furl(videoFallbackForFinal({file:a.preview},cur.doc))?`<a class="btn" href="${furl(videoFallbackForFinal({file:a.preview},cur.doc))}" download>⬇ Download assembly preview</a>`:""}
      </div>
      <div class="trackwrap"><div class="track" id="track">
        ${a.order.map((id,i)=>{const c=byId[id];
          return `<div class="tseg" draggable="true" data-i="${i}"
            style="flex-grow:${dur(id)};${c&&c.poster&&furl(c.poster)?`background-image:url('${furl(c.poster)}')`:""}">
            <span class="tno">${i+1}</span><span class="td">${Math.round(dur(id))}s</span>
            <span class="tt">${esc(c?.title||id)}</span>
            <button type="button" class="trm" data-rm="${i}" title="Remove from track" aria-label="Remove segment ${i+1}">✕</button></div>`;}).join("")
          ||'<span class="muted" style="align-self:center;padding:0 8px">Track is empty — add delivered finals below</span>'}
        <div class="playhead" id="playhead"></div>
      </div></div>
      <div class="row" style="margin-top:8px">
        ${addable.length?`<span class="muted">Add to track:</span>`+addable.map(c=>
          `<button type="button" data-add="${esc(c.id)}">＋ ${esc(c.title||c.id)}</button>`).join("")
          :`<span class="muted">All delivered clips are on the track · drag blocks to reorder · hover ✕ to remove</span>`}
      </div>
    </div>
    <div class="sec"><h3>Final export (source re-encode)</h3>
      <div class="row">
        <select id="preset">${PRESETS.map((p,i)=>`<option value="${i}">${p.label} (${p.w} × ${p.h})</option>`).join("")}</select>
        <button type="button" class="primary" id="expbtn">Export</button>
        <span class="muted">The official final is delivered by the agent in conversation; this export is a local re-encode.</span>
      </div>
      <table><tr><th>File</th><th>Preset</th><th>Time</th><th></th></tr>
        ${(a.exports||[]).map(x=>`<tr><td>${esc((x.file.startsWith("data:")?"9x16_hd_demo.mp4":x.file.split("/").pop()))}</td><td>${esc(x.preset)}</td>
          <td class="muted">${esc((x.created||"").slice(0,16).replace("T"," "))}</td>
          <td>${isVideoFile(x.file)&&furl(x.file)?`<a class="btn" href="${furl(x.file)}" download>⬇ Download</a>`:""}</td></tr>`).join("")}
      </table>
    </div>`;

  const vid=$("#seqvideo"),ph=$("#playhead"),track=$("#track");
  const segSrc=id=>{const c=byId[id];return c?(furl(curFile(c))||furl(c.proxy)):null;};
  function hl(){track.querySelectorAll(".tseg").forEach(el=>el.classList.toggle("on",Number(el.dataset.i)===seqPlayer.idx));}
  let pendingSeek=0;
  function playFrom(i,offset){
    if(!a.order.length||i<0||i>=a.order.length)return;
    const src=segSrc(a.order[i]);if(!src)return toast("This segment has no playable file");
    seqPlayer.idx=i;pendingSeek=offset||0;
    // segSrc already returns a validated browser URL; applying furl() again
    // would reject the leading "./" and leave the sequence player blank.
    vid.src=src;ph.style.display="block";
    vid.play().catch(()=>{});hl();
  }
  function stopSeq(){seqPlayer.idx=-1;ph.style.display="none";hl();}
  vid.addEventListener("loadedmetadata",()=>{
    const id=a.order[seqPlayer.idx];
    if(id&&isFinite(vid.duration)&&vid.duration>0)seqPlayer.durs[id]=vid.duration;
    if(pendingSeek>0){try{vid.currentTime=Math.min(pendingSeek,Math.max(0,vid.duration-0.05));}catch(_){}pendingSeek=0;}
  });
  vid.addEventListener("ended",()=>{seqPlayer.idx<a.order.length-1?playFrom(seqPlayer.idx+1):stopSeq();});
  vid.addEventListener("timeupdate",()=>{
    if(seqPlayer.idx<0)return;
    let el=0;for(let k=0;k<seqPlayer.idx;k++)el+=dur(a.order[k]);
    el+=vid.currentTime||0;
    const tot=a.order.reduce((s,id)=>s+dur(id),0)||1;
    ph.style.left=Math.min(99.5,el/tot*100)+"%";
  });
  $("#playall").onclick=()=>playFrom(0,0);

  /* track: click-to-seek, drag reorder, remove */
  let dragIdx=null;
  track.querySelectorAll(".tseg").forEach(el=>{
    const i=Number(el.dataset.i);
    el.addEventListener("click",e=>{
      if(e.target.closest(".trm"))return;
      const r=el.getBoundingClientRect();
      playFrom(i,(e.clientX-r.left)/r.width*dur(a.order[i]));
    });
    el.addEventListener("dragstart",()=>{dragIdx=i;});
    el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("dragover");});
    el.addEventListener("dragleave",()=>el.classList.remove("dragover"));
    el.addEventListener("drop",e=>{
      e.preventDefault();el.classList.remove("dragover");
      if(dragIdx===null||dragIdx===i)return;
      const m=a.order.splice(dragIdx,1)[0];a.order.splice(i,0,m);dragIdx=null;
      stopSeq();queueOp({op:"assembly.reorder",order:[...a.order]});tAssemble();
    });
    el.querySelector(".trm").onclick=()=>{
      a.order.splice(i,1);stopSeq();
      queueOp({op:"assembly.reorder",order:[...a.order]});tAssemble();
    };
  });
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    a.order.push(b.dataset.add);queueOp({op:"assembly.reorder",order:[...a.order]});tAssemble();
  });

  $("#mkpreview").onclick=async()=>{
    if(!a.order.length)return toast("Track is empty");
    toast("Creating local assembly preview…");
    const r=await jpost(`./api/project/${cur.slug}/assemble`,{ids:[...a.order]});
    if(r.status!==200)return toast("Assembly failed: "+(r.json.error||r.status));
    a.preview=r.json.preview;upsertFinal({id:"final_preview",kind:"preview",file:a.preview,name:"Assembly preview",preset:null,from:a.order.slice(),created:new Date().toISOString(),status:"active"});queueOp({op:"assembly.preview_built",order:[...a.order]});
    toast("Assembly preview generated");tAssemble();
  };
  $("#expbtn").onclick=async()=>{
    if(!a.order.length)return toast("Track is empty");
    const p=PRESETS[Number($("#preset").value)];
    toast(`Exporting (${p.label})… source re-encoding may take a moment`);
    const r=await jpost(`./api/project/${cur.slug}/export`,{preset:p,ids:[...a.order]});
    if(r.status!==200)return toast("Export failed: "+(r.json.error||r.status));
    const created=new Date().toISOString();const exportRecord={file:r.json.file,preset:p.label,created,from:"assembly"};(a.exports=a.exports||[]).push(exportRecord);upsertFinal({id:stableId("final",r.json.file,p.label,created),kind:"export",file:r.json.file,name:p.label,preset:p.label,from:a.order.slice(),created,status:"active"});
    queueOp({op:"export.created",file:r.json.file,preset:p.label});
    toast("Export complete");tAssemble();
  };
}

/* ----- logs ----- */
async function tLogs(){
  /* Cache the raw log text per project (30s TTL): every tab click used to
     re-fetch and re-parse a large append-only file, which made rapid tab
     switching heavy. */
  let txt="";
  if(cur._logsCache&&cur._logsCache.slug===cur.slug&&(Date.now()-(cur._logsCache.at||0))<30000){txt=cur._logsCache.text;}
  else{
    try{const r=await fetch(furl("logs/edits.log"),{cache:"no-store"});if(r.ok)txt=await r.text();}catch(_){}
    cur._logsCache={slug:cur.slug,text:txt,at:Date.now()};
  }
  const rows=txt.trim().split("\n").filter(Boolean).slice(-120).reverse().map(l=>{try{return JSON.parse(l);}catch(_){return null;}}).filter(Boolean);
  $("#tabbody").innerHTML=`<div class="sec"><h3>Activity logs (latest ${rows.length} entries)</h3>
    <table><tr><th>Time</th><th>Action</th><th>Details</th></tr>
    ${rows.map(o=>`<tr><td class="muted">${esc((o.ts||"").slice(5,19).replace("T"," "))}</td>
      <td>${esc(o.op)}</td><td class="muted">${esc(JSON.stringify(Object.fromEntries(Object.entries(o).filter(([k])=>!["op","ts","rev"].includes(k)))).slice(0,160))}</td></tr>`).join("")||"<tr><td colspan=3 class='muted'>None</td></tr>"}
    </table></div>`;
}

/* ----- lightweight adaptive polling -----
 * The server exposes change tokens so a stable project does not repeatedly
 * transfer its complete manifest/media lists.  Polling is paused while the
 * management window is hidden and resumes immediately when it is visible.
 */
function projectIsActive(){
  const value=String(cur.state?.phase||cur.doc?.status||"").toLowerCase();
  return ["planning","queued","running","generating","receiving","reviewing"].includes(value)
    || syncState.pending_count>0 || syncState.running;
}
function nextPollDelay(){
  if(document.hidden)return 0;
  if(cur.slug&&projectIsActive())return 3000;
  if(syncState.pending_count>0||syncState.running)return 5000;
  return 20000;
}
function schedulePoll(delay=null){
  if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}
  if(document.hidden)return;
  const wait=delay===null?nextPollDelay():Math.max(0,Number(delay)||0);
  pollDelay=wait||3000;
  pollTimer=setTimeout(runPoll,wait);
}
async function pollProjectChanges(){
  const slug=cur.slug;
  /* Studio commits are asynchronous and update the manifest before the
     browser's local timeline callback resumes.  Wait for those writes to
     settle; otherwise the editor's own revision bump can be mistaken for an
     external change and route() rebuilds the page, dropping the selected
     preview/inspector state immediately after a click. */
  if(!slug||cur.dirty||cur.saving||(cur.tab==="studio"&&studio.slug===slug&&studio.pendingWrites>0))return;
  try{
    const change=await jget(`./api/project/${encodeURIComponent(slug)}/changes`);
    if(slug!==cur.slug)return;
    applySyncState(change.sync);
    const token=String(change.token||"");
    if(!cur.doc||!cur.changeToken||token!==String(cur.changeToken)){
      /* The editor's own commits and render completions bump the project
         revision; rebuilding #tabbody for them replaced the canvas/video
         elements and made the monitor blink on every poll.  A change the
         editor already observed (rev === studio.rev) is skipped; only real
         external changes (handoffs, other surfaces) force a reload. */
      const studioActive=cur.tab==="studio"&&studio.slug===slug;
      if(studioActive&&!cur.dirty&&!cur.saving&&studio.rev!=null&&String(change.project_rev??"")===String(studio.rev)){
        refreshSyncPanelDom();
        return;
      }
      const d=await jget(`./api/project/${encodeURIComponent(slug)}`);
      if(slug!==cur.slug)return;
      applySyncState(d.sync);
      const wasMissing=!cur.doc;
      cur.doc=normalizeClientProject(d.project);cur.state=d.state;cur.changeToken=d.changes?.token||token;cur.pendingOps=[];cur.dirty=false;
      if(studioActive){await studioLoad(true);renderStudio();}
      else if(hasTransientMediaUI()){cur.renderDeferred=true;}
      else renderProject();
  if(wasMissing)toast("Project auto-ingested");
    }else refreshSyncPanelDom();
  }catch(error){
    if(slug!==cur.slug)return;
    applySyncState(error?.data?.sync);
    if(Number(error?.status||error?.message)!==404)return;
    // A project can be created by a background handoff after this route was
    // opened.  A list token check is enough to discover it without fetching
    // full project rows on every three-second tick.
    if(cur.doc)return;
    try{
      const listChange=await jget("./api/projects/changes");
      if(slug!==cur.slug)return;
      applySyncState(listChange.sync);
      if(String(listChange.index_token||"")!==String(listChangeToken||"")){
        const list=await jget("./api/projects");
        if(slug!==cur.slug)return;
        listChangeToken=String(list.index_token||listChangeToken||"");
        const found=Array.isArray(list.projects)&&list.projects.some(item=>String(item?.slug||"")===slug);
        if(found)await route();
        else if(!document.querySelector(".receive-panel.waiting"))renderWaitingProject();
      }else if(!document.querySelector(".receive-panel.waiting"))renderWaitingProject();
    }catch(_){if(!document.querySelector(".receive-panel.waiting"))renderWaitingProject("Unable to load projects. The manager will keep retrying the connection.");}
  }
}
async function pollListChanges(){
  try{
    const change=await jget("./api/projects/changes");
    const before=JSON.stringify([syncState.state,syncState.running,syncState.pending_count,syncState.received,syncState.failed]);
    applySyncState(change.sync);
    const after=JSON.stringify([syncState.state,syncState.running,syncState.pending_count,syncState.received,syncState.failed]);
    const token=String(change.index_token||"");
     if(!listChangeToken||token!==String(listChangeToken)){
       const libraryRoute=location.hash==="#/assets"||location.hash.startsWith("#/assets?");
       if(libraryRoute&&typeof workspaceRenderLibrary==="function")await workspaceRenderLibrary();
       else await renderList();
     }
    else if(before!==after)refreshSyncPanelDom();
  }catch(_){applySyncState({state:"error",running:false});}
}
async function runPoll(){
  pollTimer=null;
  if(document.hidden||pollBusy){if(!document.hidden)schedulePoll(1000);return;}
  pollBusy=true;
  try{if(cur.slug)await pollProjectChanges();else await pollListChanges();}
  finally{pollBusy=false;schedulePoll();}
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}}
  else schedulePoll(0);
});

notifyReady();
route().finally(()=>schedulePoll(0));

</script>
